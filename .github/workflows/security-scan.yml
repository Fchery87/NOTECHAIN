name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan every Sunday at midnight
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  # Three independent jobs so one failing scan does not hide whether the others work.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # npm audit needs a package-lock.json, which this Bun repo does not have, so it
      # failed with ENOLOCK on every run. bun audit reads bun.lock. The gate is
      # critical advisories in production dependencies; lower severities and
      # dev-only packages are reported by `bun audit` but do not fail the build.
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=critical

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # TruffleHog scans commit ranges, so it needs history.
          fetch-depth: 0

      # No base/head inputs: the action picks the range for each event itself (push
      # before..after, pull request base..head, full history on schedule). Passing
      # base: main made it resolve a branch that does not exist.
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          version: 3.97.9
          extra_args: --only-verified
